services:
  postgres:
    image: postgres:15
    container_name: sao_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sao_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sao_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: sao_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "-u", "mongo", "-p", "mongo", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: sao-telegram-bot:local
    container_name: sao_app
    depends_on:
      - postgres
      - mongo
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sao_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://mongo:mongo@mongo:27017/sao_bot_mongo?authSource=admin
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_NAME: ${BOT_NAME:-sao_telegram_bot}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8080}
    ports:
      - "8080:8080"
    restart: on-failure
    # don't mount source by default; if you want hot-reload during development uncomment below and use bootRun
    # volumes:
    #   - ./:/app
    # command: ["./gradlew", "bootRun"]

volumes:
  postgres-data:
  mongo-data:
