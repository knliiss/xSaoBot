name: Build and Deploy to Fly

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build (assemble jar)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Verify JAR exists
        run: |
          echo "Listing build/libs contents:";
          ls -al build/libs || (echo "No build/libs directory found" && exit 1);
          find build/libs -maxdepth 1 -type f -name '*.jar' -print -exec ls -lh {} \;

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Use build-only + push to ensure Fly builds the image on their side if needed
          flyctl deploy --build-only --push -a ${{ secrets.FLY_APP }}
