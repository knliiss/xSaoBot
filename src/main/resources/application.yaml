spring:
  application:
    name: sao-bot-service
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  cache:
    type: redis

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

bot:
    token: ${BOT_TOKEN}
    name: ${BOT_NAME:Sao_Bot}

# Note: legacy config keys (spring.data.redis.*) were consolidated to spring.redis.* for Spring Boot compatibility
