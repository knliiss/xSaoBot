spring:
  application:
    name: sao-bot-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

bot:
  token: ${BOT_TOKEN}
  name: ${BOT_NAME}

# Actuator / health endpoint config used by Fly health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: NEVER
  server:
    port: ${MANAGEMENT_PORT:8080}

